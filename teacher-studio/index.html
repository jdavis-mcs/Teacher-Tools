<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { overscroll-behavior: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- Icons ---
        const IconCamera = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
        const IconVideoOff = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>);
        const IconImage = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>);
        const IconVideo = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>);
        const IconPen = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>);
        const IconEraser = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>);
        const IconTrash = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>);
        const IconMove = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="19 9 22 12 19 15"/><polyline points="9 19 12 22 15 19"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/></svg>);
        const IconMax = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>);
        const IconMin = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>);
        const IconX = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const IconChevronLeft = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>);
        const IconChevronRight = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>);
        const IconPlus = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
        const IconDownload = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
        const IconUpload = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
        const IconPointer = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/></svg>);
        const IconType = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>);
        const IconInfo = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>);
        const IconMail = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>);
        const IconTimer = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);
        const IconPlay = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>);
        const IconPause = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>);
        const IconRefresh = ({ size = 24, className }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>);

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const TeacherStudio = () => {
          // --- State ---
          const [tool, setTool] = useState('pen'); 
          const [color, setColor] = useState('#000000');
          const [brushSize, setBrushSize] = useState(4);
          const [isWebcamActive, setIsWebcamActive] = useState(false);
          const [webcamConfig, setWebcamConfig] = useState({ x: 20, y: 80, width: 320, height: 240, isMinimized: false });
          
          // FIXED: Use ref for drawing state to prevent lag
          const isDrawingRef = useRef(false);
          
          const [isLoading, setIsLoading] = useState(false);
          const [showAbout, setShowAbout] = useState(false);
          const [editingTextId, setEditingTextId] = useState(null);
          
          // Timer
          const [isTimerActive, setIsTimerActive] = useState(false);
          const [timerTime, setTimerTime] = useState(300);
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [timerConfig, setTimerConfig] = useState({ x: window.innerWidth - 250, y: 80 });

          // Pages
          const [pages, setPages] = useState([{ id: generateId(), drawingData: null, mediaItems: [] }]);
          const [currentPageIndex, setCurrentPageIndex] = useState(0);
          const [currentMediaItems, setCurrentMediaItems] = useState([]);

          const canvasRef = useRef(null);
          const contextRef = useRef(null);
          const videoRef = useRef(null);
          const streamRef = useRef(null);
          const dragItemRef = useRef(null); 

          // --- Init Canvas ---
          useEffect(() => {
            const canvas = canvasRef.current;
            canvas.width = window.innerWidth * 2;
            canvas.height = window.innerHeight * 2;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;

            const context = canvas.getContext('2d');
            context.scale(2, 2);
            context.lineCap = 'round';
            context.strokeStyle = color;
            context.lineWidth = brushSize;
            contextRef.current = context;
          }, []);

          // --- Sync Tool/Color ---
          useEffect(() => {
            if (contextRef.current) {
              contextRef.current.strokeStyle = tool === 'eraser' ? '#f3f4f6' : color;
              contextRef.current.lineWidth = brushSize;
              contextRef.current.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
              contextRef.current.beginPath();
            }
          }, [color, brushSize, tool]);

          // --- Timer ---
          useEffect(() => {
            let interval = null;
            if (isTimerRunning && timerTime > 0) {
              interval = setInterval(() => setTimerTime(t => t - 1), 1000);
            } else if (timerTime === 0) {
              setIsTimerRunning(false);
            }
            return () => clearInterval(interval);
          }, [isTimerRunning, timerTime]);

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          };

          // --- Pages ---
          const saveCurrentPageToState = () => {
             const canvas = canvasRef.current;
             const dataUrl = canvas.toDataURL();
             setPages(prev => prev.map((p, idx) => {
                 if (idx === currentPageIndex) return { ...p, drawingData: dataUrl, mediaItems: currentMediaItems };
                 return p;
             }));
          };

          const loadPage = (index, allPages = pages) => {
              const targetPage = allPages[index];
              if (!targetPage) return;
              const canvas = canvasRef.current;
              const ctx = contextRef.current;
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              setCurrentMediaItems(targetPage.mediaItems);
              if (targetPage.drawingData) {
                  const img = new Image();
                  img.onload = () => {
                      ctx.save();
                      ctx.globalCompositeOperation = 'source-over';
                      ctx.setTransform(1, 0, 0, 1, 0, 0); 
                      ctx.drawImage(img, 0, 0);
                      ctx.scale(2, 2);
                      ctx.restore();
                      // Restore current tool settings
                      ctx.strokeStyle = tool === 'eraser' ? '#f3f4f6' : color;
                      ctx.lineWidth = brushSize;
                      ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
                  };
                  img.src = targetPage.drawingData;
              }
          };

          const handleAddPage = () => {
              saveCurrentPageToState();
              const newPage = { id: generateId(), drawingData: null, mediaItems: [] };
              setPages(prev => {
                  const newPages = [...prev, newPage];
                  setTimeout(() => { setCurrentPageIndex(newPages.length - 1); loadPage(newPages.length - 1, newPages); }, 0);
                  return newPages;
              });
          };

          const handleNextPage = () => {
              if (currentPageIndex < pages.length - 1) {
                  saveCurrentPageToState();
                  setTimeout(() => { setCurrentPageIndex(prev => { const newIdx = prev + 1; loadPage(newIdx); return newIdx; }); }, 0);
              }
          };

          const handlePrevPage = () => {
              if (currentPageIndex > 0) {
                  saveCurrentPageToState();
                  setTimeout(() => { setCurrentPageIndex(prev => { const newIdx = prev - 1; loadPage(newIdx); return newIdx; }); }, 0);
              }
          };

          const handleDeletePage = () => {
              if (pages.length <= 1) {
                  const canvas = canvasRef.current;
                  contextRef.current.clearRect(0, 0, canvas.width, canvas.height);
                  setCurrentMediaItems([]);
                  setPages([{ id: generateId(), drawingData: null, mediaItems: [] }]);
                  return;
              }
              if (!confirm("Are you sure you want to delete this page?")) return;
              const newPages = pages.filter((_, idx) => idx !== currentPageIndex);
              let newIndex = currentPageIndex;
              if (newIndex >= newPages.length) newIndex = newPages.length - 1;
              setPages(newPages);
              setCurrentPageIndex(newIndex);
              loadPage(newIndex, newPages);
          };

          // --- Export/Import ---
          const handleExport = async () => {
            setIsLoading(true);
            const canvas = canvasRef.current;
            const currentDrawingData = canvas.toDataURL();
            const pagesToProcess = pages.map((p, idx) => {
                if (idx === currentPageIndex) return { ...p, drawingData: currentDrawingData, mediaItems: currentMediaItems };
                return p;
            });
            try {
                const processedPages = await Promise.all(pagesToProcess.map(async (page) => {
                    const processedMedia = await Promise.all(page.mediaItems.map(async (item) => {
                        if (item.type !== 'text' && item.url.startsWith('blob:')) {
                            try {
                                const resp = await fetch(item.url);
                                const blob = await resp.blob();
                                return new Promise((resolve) => {
                                    const reader = new FileReader();
                                    reader.onloadend = () => resolve({ ...item, url: reader.result });
                                    reader.readAsDataURL(blob);
                                });
                            } catch (e) { return item; }
                        }
                        return item;
                    }));
                    return { ...page, mediaItems: processedMedia };
                }));
                const exportData = { version: 1, date: new Date().toISOString(), pages: processedPages };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "teacher_studio_project.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            } catch (err) { alert("Export failed"); } finally { setIsLoading(false); }
          };

          const handleImport = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setIsLoading(true);
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    const importedPages = data.pages || data;
                    if (!Array.isArray(importedPages)) throw new Error("Invalid file");
                    setPages(importedPages);
                    setCurrentPageIndex(0);
                    loadPage(0, importedPages);
                } catch (err) { alert("Import failed"); } finally { setIsLoading(false); e.target.value = null; }
            };
            reader.readAsText(file);
          };

          // --- Webcam ---
          const toggleWebcam = async () => {
            if (isWebcamActive) {
              if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
              setIsWebcamActive(false);
            } else {
              try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                streamRef.current = stream;
                setIsWebcamActive(true);
                setTimeout(() => { if (videoRef.current) videoRef.current.srcObject = stream; }, 100);
              } catch (err) { alert("Camera access denied"); }
            }
          };

          // --- Text ---
          const addTextItem = (x, y) => {
             const id = generateId();
             const newItem = {
                 id,
                 type: 'text',
                 content: '',
                 x: x - 100, // Center on click
                 y: y - 25, 
                 width: 220, height: 100,
                 color: color,
                 fontSize: 24
             };
             setCurrentMediaItems(prev => [...prev, newItem]);
             setEditingTextId(id);
             setTool('text'); 
          };

          const handleTextUpdate = (id, newText) => {
             setCurrentMediaItems(prev => prev.map(item => {
                 if (item.id === id) return { ...item, content: newText };
                 return item;
             }));
          };

          const handleTextBlur = (id) => {
             setEditingTextId(null);
             setCurrentMediaItems(prev => prev.filter(item => {
                 if (item.id === id && !item.content.trim()) return false;
                 return true;
             }));
          };

          // --- Drawing ---
          const startDrawing = (e) => {
            if (tool === 'cursor') return; 
            
            let clientX, clientY;
            const rect = canvasRef.current.getBoundingClientRect();
            
            if (e.nativeEvent.changedTouches) {
                clientX = e.nativeEvent.changedTouches[0].clientX - rect.left;
                clientY = e.nativeEvent.changedTouches[0].clientY - rect.top;
            } else {
                clientX = e.clientX - rect.left;
                clientY = e.clientY - rect.top;
            }

            if (tool === 'text') {
                addTextItem(clientX, clientY);
                return;
            }

            contextRef.current.beginPath();
            contextRef.current.moveTo(clientX, clientY);
            isDrawingRef.current = true; // Use Ref for immediate response
          };

          const draw = (e) => {
            if (!isDrawingRef.current || tool === 'cursor' || tool === 'text') return;
            let clientX, clientY;
            const rect = canvasRef.current.getBoundingClientRect();
            if (e.nativeEvent.changedTouches) {
                e.preventDefault(); 
                clientX = e.nativeEvent.changedTouches[0].clientX - rect.left;
                clientY = e.nativeEvent.changedTouches[0].clientY - rect.top;
            } else {
                clientX = e.clientX - rect.left;
                clientY = e.clientY - rect.top;
            }
            contextRef.current.lineTo(clientX, clientY);
            contextRef.current.stroke();
          };

          const stopDrawing = () => {
            if (isDrawingRef.current) {
              contextRef.current.closePath();
              isDrawingRef.current = false;
            }
          };

          const clearCanvas = () => {
            const canvas = canvasRef.current;
            const ctx = contextRef.current;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          };

          // --- Media ---
          const handleFileUpload = (e, type) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const newItem = {
              id: generateId(), type, url,
              x: window.innerWidth / 2 - 150, y: window.innerHeight / 2 - 150, width: 300
            };
            setCurrentMediaItems(prev => [...prev, newItem]);
            e.target.value = null;
          };

          const removeMedia = (id) => {
            setCurrentMediaItems(prev => prev.filter(item => item.id !== id));
          };

          // --- Drag/Resize ---
          const startDrag = (e, item, type) => {
            if (type !== 'timer' && tool !== 'cursor' && !(tool === 'text' && type === 'text')) return;
            e.preventDefault();
            e.stopPropagation();
            
            const clientX = e.clientX || e.touches?.[0]?.clientX;
            const clientY = e.clientY || e.touches?.[0]?.clientY;
            
            let initialData;
            if (type === 'webcam') initialData = { id: 'webcam', mode: 'move', initialX: webcamConfig.x, initialY: webcamConfig.y };
            else if (type === 'timer') initialData = { id: 'timer', mode: 'move', initialX: timerConfig.x, initialY: timerConfig.y };
            else initialData = { id: item.id, mode: 'move', initialX: item.x, initialY: item.y };

            dragItemRef.current = { ...initialData, startX: clientX, startY: clientY };
            window.addEventListener('mousemove', handleGlobalMouseMove);
            window.addEventListener('mouseup', handleGlobalMouseUp);
            window.addEventListener('touchmove', handleGlobalMouseMove);
            window.addEventListener('touchend', handleGlobalMouseUp);
          };

          const startResize = (e, item, type) => {
            if (tool !== 'cursor' && tool !== 'text') return;
            e.preventDefault();
            e.stopPropagation();
            const clientX = e.clientX || e.touches?.[0]?.clientX;
            const initialData = type === 'webcam'
                ? { id: 'webcam', mode: 'resize', initialWidth: webcamConfig.width, startX: clientX }
                : { id: item.id, mode: 'resize', initialWidth: item.width, startX: clientX };
            dragItemRef.current = initialData;
            window.addEventListener('mousemove', handleGlobalMouseMove);
            window.addEventListener('mouseup', handleGlobalMouseUp);
            window.addEventListener('touchmove', handleGlobalMouseMove);
            window.addEventListener('touchend', handleGlobalMouseUp);
          };

          const handleGlobalMouseMove = useCallback((e) => {
            if (!dragItemRef.current) return;
            const clientX = e.clientX || e.touches?.[0]?.clientX;
            const clientY = e.clientY || e.touches?.[0]?.clientY;
            const { id, mode, startX, startY, initialX, initialY, initialWidth } = dragItemRef.current;
            
            if (mode === 'move') {
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                if (id === 'webcam') setWebcamConfig(prev => ({ ...prev, x: initialX + deltaX, y: initialY + deltaY }));
                else if (id === 'timer') setTimerConfig(prev => ({ ...prev, x: initialX + deltaX, y: initialY + deltaY }));
                else setCurrentMediaItems(prev => prev.map(item => {
                        if (item.id === id) return { ...item, x: initialX + deltaX, y: initialY + deltaY };
                        return item;
                    }));
            } else if (mode === 'resize') {
                const deltaX = clientX - startX;
                const newWidth = Math.max(50, initialWidth + deltaX); 
                if (id === 'webcam') setWebcamConfig(prev => ({ ...prev, width: newWidth }));
                else setCurrentMediaItems(prev => prev.map(item => {
                        if (item.id === id) return { ...item, width: newWidth };
                        return item;
                    }));
            }
          }, []);

          const handleGlobalMouseUp = useCallback(() => {
            dragItemRef.current = null;
            window.removeEventListener('mousemove', handleGlobalMouseMove);
            window.removeEventListener('mouseup', handleGlobalMouseUp);
            window.removeEventListener('touchmove', handleGlobalMouseMove);
            window.removeEventListener('touchend', handleGlobalMouseUp);
          }, [handleGlobalMouseMove]);

          // --- Components ---
          const ToolButton = ({ active, onClick, icon: Icon, title }) => (
            <button onClick={onClick} title={title} className={`p-3 rounded-xl transition-all duration-200 flex items-center justify-center ${active ? 'bg-indigo-600 text-white shadow-lg scale-105' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200 shadow-sm'}`}><Icon size={20} /></button>
          );
          const ColorDot = ({ c }) => (
            <button onClick={() => { setColor(c); if(tool!=='text') setTool('pen'); }} className={`w-6 h-6 rounded-full border-2 transition-all ${color === c ? 'border-indigo-600 scale-110 shadow' : 'border-transparent hover:scale-110'}`} style={{ backgroundColor: c }} />
          );

          // --- Layout ---
          const getZIndex = (item) => {
             if (item.id === editingTextId) return 50;
             if (tool === 'text' || tool === 'cursor') {
                 if (item.type === 'text') return 35;
                 return 10;
             }
             return 10;
          };
          const mediaPointerEvents = (tool === 'cursor' || tool === 'text') ? 'pointer-events-auto' : 'pointer-events-none';
          const canvasPointerEvents = (tool === 'cursor') ? 'pointer-events-none' : 'pointer-events-auto';

          return (
            <div className="fixed inset-0 overflow-hidden bg-gray-50 font-sans selection:bg-indigo-100">
              <div className="absolute inset-0 pointer-events-none -z-10 opacity-[0.03]" style={{ backgroundImage: 'radial-gradient(circle, #000 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

              {/* Timer */}
              {isTimerActive && (
                  <div className="absolute bg-white rounded-xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col z-50 w-64" style={{ left: timerConfig.x, top: timerConfig.y }}>
                    <div className="bg-indigo-600 text-white p-2 flex justify-between items-center cursor-move" onMouseDown={(e) => startDrag(e, null, 'timer')} onTouchStart={(e) => startDrag(e, null, 'timer')}>
                       <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-2"><IconTimer size={14}/> Timer</span>
                       <button onClick={() => setIsTimerActive(false)} className="hover:text-red-200"><IconX size={14}/></button>
                    </div>
                    <div className="p-4 flex flex-col items-center gap-3">
                       <div className={`text-5xl font-mono font-bold ${timerTime <= 10 && timerTime > 0 ? 'text-red-600 animate-pulse' : 'text-gray-800'}`}>{formatTime(timerTime)}</div>
                       <div className="flex gap-2 w-full justify-center">
                          <button onClick={() => setIsTimerRunning(!isTimerRunning)} className={`p-2 rounded-full text-white shadow-lg transition-transform hover:scale-105 ${isTimerRunning ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-green-600 hover:bg-green-700'}`}>{isTimerRunning ? <IconPause size={24} /> : <IconPlay size={24} />}</button>
                          <button onClick={() => { setIsTimerRunning(false); setTimerTime(300); }} className="p-2 rounded-full bg-gray-200 text-gray-700 shadow hover:bg-gray-300 transition-transform hover:scale-105"><IconRefresh size={24} /></button>
                       </div>
                       <div className="flex gap-1 text-xs pt-1 w-full justify-center">
                          <button onClick={() => setTimerTime(t => t + 60)} className="px-2 py-1 bg-gray-100 hover:bg-indigo-50 text-gray-600 rounded border border-gray-200">+1m</button>
                          <button onClick={() => setTimerTime(t => t + 300)} className="px-2 py-1 bg-gray-100 hover:bg-indigo-50 text-gray-600 rounded border border-gray-200">+5m</button>
                          <button onClick={() => setTimerTime(t => Math.max(0, t - 60))} className="px-2 py-1 bg-gray-100 hover:bg-red-50 text-gray-600 rounded border border-gray-200">-1m</button>
                       </div>
                    </div>
                  </div>
              )}

              {/* Webcam */}
              {isWebcamActive && (
                <div className={`absolute bg-black rounded-lg shadow-2xl flex flex-col border-4 border-gray-800 ${mediaPointerEvents}`} style={{ left: webcamConfig.x, top: webcamConfig.y, width: webcamConfig.isMinimized ? 200 : webcamConfig.width, height: 'auto', zIndex: 20, cursor: tool === 'cursor' ? 'move' : 'default', touchAction: 'none' }} onMouseDown={(e) => startDrag(e, null, 'webcam')} onTouchStart={(e) => startDrag(e, null, 'webcam')}>
                  <div className="bg-gray-900/80 text-white p-2 flex justify-between items-center backdrop-blur-sm">
                    <span className="text-xs font-bold uppercase tracking-wider flex items-center gap-2"><div className="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>Live</span>
                    <div className="flex gap-2">
                       <button onClick={(e) => { e.stopPropagation(); setWebcamConfig(p => ({...p, isMinimized: !p.isMinimized}))}} className={`hover:text-indigo-400 transition-colors ${mediaPointerEvents}`}>{webcamConfig.isMinimized ? <IconMax size={14} /> : <IconMin size={14} />}</button>
                       <button onClick={(e) => { e.stopPropagation(); toggleWebcam(); }} className={`hover:text-red-400 transition-colors ${mediaPointerEvents}`}><IconX size={14} /></button>
                    </div>
                  </div>
                  <div className="relative bg-black w-full h-full min-h-[100px] flex items-center justify-center group">
                     <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-contain pointer-events-none" />
                     {!webcamConfig.isMinimized && tool === 'cursor' && (
                       <div className="absolute bottom-0 right-0 w-6 h-6 cursor-se-resize z-50 flex items-end justify-end p-1" onMouseDown={(e) => startResize(e, null, 'webcam')} onTouchStart={(e) => startResize(e, null, 'webcam')}><div className="w-2 h-2 bg-white rounded-full shadow-sm mb-1 mr-1"></div></div>
                     )}
                  </div>
                </div>
              )}

              {/* Media Items */}
              {currentMediaItems.map((item) => (
                <div key={item.id} className={`absolute group ${mediaPointerEvents}`} style={{ left: item.x, top: item.y, width: item.width, zIndex: getZIndex(item) }}>
                  {tool === 'cursor' && (
                    <div className="absolute -top-8 left-0 right-0 h-8 bg-indigo-600 rounded-t-lg flex items-center justify-between px-3 text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-move shadow-lg" onMouseDown={(e) => startDrag(e, item, 'media')} onTouchStart={(e) => startDrag(e, item, 'media')}>
                      <span className="text-xs font-medium flex items-center gap-1"><IconMove size={12} /> Drag</span>
                      <button onClick={() => removeMedia(item.id)} className="hover:bg-indigo-700 p-1 rounded"><IconTrash size={14} /></button>
                    </div>
                  )}
                  
                  {item.type === 'text' ? (
                     <div 
                        className={`min-h-[50px] relative rounded p-1 ${tool === 'cursor' || tool === 'text' ? 'border-2 border-transparent group-hover:border-indigo-600 border-dashed' : ''} ${editingTextId === item.id ? 'z-50' : ''}`}
                        onDoubleClick={() => { setTool('text'); setEditingTextId(item.id); }}
                        onMouseDown={(e) => { if(tool === 'text') { e.stopPropagation(); setEditingTextId(item.id); } }}
                     >
                        {editingTextId === item.id ? (
                            <textarea
                                autoFocus
                                className="w-full h-full min-h-[80px] bg-white resize-none outline-none p-2 rounded border-2 border-blue-500 shadow-lg text-base"
                                style={{ color: item.color, fontSize: `${item.fontSize}px`, lineHeight: 1.2 }}
                                value={item.content}
                                placeholder="Type here..."
                                onChange={(e) => handleTextUpdate(item.id, e.target.value)}
                                onBlur={() => handleTextBlur(item.id)}
                                onKeyDown={(e) => { e.stopPropagation(); }}
                            />
                        ) : (
                            <div className="w-full h-full p-2 whitespace-pre-wrap break-words" style={{ color: item.color, fontSize: `${item.fontSize}px`, lineHeight: 1.2 }}>
                                {item.content || <span className="text-gray-400 italic select-none bg-gray-100/50 px-2 py-1 rounded">Type here...</span>}
                            </div>
                        )}
                        {(tool === 'cursor' || tool === 'text') && (
                          <div className="absolute bottom-0 right-0 w-6 h-6 cursor-se-resize z-50 flex items-end justify-end p-1 opacity-0 group-hover:opacity-100 transition-opacity" onMouseDown={(e) => startResize(e, item, 'media')} onTouchStart={(e) => startResize(e, item, 'media')}>
                            <div className="w-3 h-3 bg-indigo-600 border border-white rounded-full shadow-sm mb-[-4px] mr-[-4px]"></div>
                          </div>
                        )}
                     </div>
                  ) : (
                      <div className={`relative bg-white p-1 shadow-xl rounded-b-lg ${tool === 'cursor' ? 'rounded-t-none border-2 border-transparent group-hover:border-indigo-600' : 'rounded-t-lg'} transition-colors`}>
                        {item.type === 'image' ? (<img src={item.url} alt="Media" className="w-full h-auto rounded pointer-events-none select-none" draggable={false} />) : (<video src={item.url} controls className="w-full h-auto rounded" />)}
                        {tool === 'cursor' && (
                          <div className="absolute bottom-0 right-0 w-6 h-6 cursor-se-resize z-50 flex items-end justify-end p-1 opacity-0 group-hover:opacity-100 transition-opacity" onMouseDown={(e) => startResize(e, item, 'media')} onTouchStart={(e) => startResize(e, item, 'media')}>
                            <div className="w-3 h-3 bg-indigo-600 border border-white rounded-full shadow-sm mb-[-4px] mr-[-4px]"></div>
                          </div>
                        )}
                      </div>
                  )}
                </div>
              ))}

              {/* Canvas */}
              <canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className={`absolute inset-0 touch-none ${canvasPointerEvents} ${tool === 'eraser' ? 'cursor-crosshair' : tool === 'pen' ? 'cursor-crosshair' : tool === 'text' ? 'cursor-text' : 'cursor-default'}`} style={{ zIndex: 30 }} />

              {/* Controls */}
              <div className="fixed bottom-6 left-6 bg-white/90 backdrop-blur-lg shadow-xl border border-gray-200 rounded-2xl px-3 py-2 flex items-center gap-2 z-[100]">
                 <button onClick={handlePrevPage} disabled={currentPageIndex === 0} className="p-2 hover:bg-gray-100 rounded-xl disabled:opacity-30 transition-colors text-gray-700"><IconChevronLeft size={20} /></button>
                 <div className="px-2 font-medium text-gray-600 text-sm min-w-[60px] text-center select-none">Page {currentPageIndex + 1} / {pages.length}</div>
                 <button onClick={handleNextPage} disabled={currentPageIndex === pages.length - 1} className="p-2 hover:bg-gray-100 rounded-xl disabled:opacity-30 transition-colors text-gray-700"><IconChevronRight size={20} /></button>
                 <div className="w-px h-6 bg-gray-300 mx-1"></div>
                 <button onClick={handleAddPage} className="p-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl transition-colors"><IconPlus size={20} /></button>
                 <button onClick={handleDeletePage} className="p-2 hover:bg-red-50 text-gray-400 hover:text-red-500 rounded-xl transition-colors"><IconTrash size={18} /></button>
              </div>

              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-lg shadow-2xl border border-gray-200 rounded-2xl px-4 py-3 flex items-center gap-4 z-[100] max-w-[95vw] overflow-x-auto scrollbar-hide">
                <div className="flex items-center gap-2 pr-4 border-r border-gray-200">
                  <ToolButton active={tool === 'cursor'} onClick={() => setTool('cursor')} icon={IconPointer} title="Select / Move" />
                </div>
                <div className="flex items-center gap-2 pr-4 border-r border-gray-200">
                  <ToolButton active={tool === 'pen'} onClick={() => setTool('pen')} icon={IconPen} title="Pen" />
                  <ToolButton active={tool === 'text'} onClick={() => setTool('text')} icon={IconType} title="Text Box" />
                  <div className="flex flex-col gap-1 px-2">
                    <div className="flex gap-1">{['#000000', '#EF4444', '#2563EB', '#16A34A'].map(c => <ColorDot key={c} c={c} />)}</div>
                    <div className="flex gap-1">{['#D97706', '#9333EA', '#EC4899', '#4B5563'].map(c => <ColorDot key={c} c={c} />)}</div>
                  </div>
                  <input type="range" min="1" max="20" value={brushSize} onChange={(e) => setBrushSize(parseInt(e.target.value))} className="w-20 accent-indigo-600" title={tool === 'text' ? "Text Size" : "Brush Size"} />
                </div>
                <div className="flex items-center gap-2 pr-4 border-r border-gray-200">
                  <ToolButton active={tool === 'eraser'} onClick={() => setTool('eraser')} icon={IconEraser} title="Eraser" />
                  <ToolButton active={false} onClick={clearCanvas} icon={IconTrash} title="Clear Board" />
                </div>
                <div className="flex items-center gap-2">
                  <label className="cursor-pointer"><div className="p-3 rounded-xl bg-white text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 shadow-sm transition-all flex items-center justify-center"><IconImage size={20} /></div><input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileUpload(e, 'image')} /></label>
                  <label className="cursor-pointer"><div className="p-3 rounded-xl bg-white text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 border border-gray-200 shadow-sm transition-all flex items-center justify-center"><IconVideo size={20} /></div><input type="file" accept="video/*" className="hidden" onChange={(e) => handleFileUpload(e, 'video')} /></label>
                  <button onClick={toggleWebcam} className={`p-3 rounded-xl transition-all flex items-center justify-center gap-2 font-medium ${isWebcamActive ? 'bg-red-50 text-red-600 border border-red-200 shadow-sm' : 'bg-gray-800 text-white hover:bg-gray-900 shadow-lg border border-transparent'}`}>{isWebcamActive ? <IconVideoOff size={20} /> : <IconCamera size={20} />}<span className="hidden sm:inline">{isWebcamActive ? 'Stop' : 'Cam'}</span></button>
                  <button onClick={() => setIsTimerActive(!isTimerActive)} className={`p-3 rounded-xl transition-all flex items-center justify-center gap-2 font-medium ${isTimerActive ? 'bg-indigo-50 text-indigo-600 border border-indigo-200 shadow-sm' : 'bg-gray-800 text-white hover:bg-gray-900 shadow-lg border border-transparent'}`} title="Toggle Timer"><IconTimer size={20} /></button>
                </div>
              </div>

              <div className="fixed top-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg border border-gray-200 z-40 flex items-center gap-4">
                <h1 className="text-sm font-bold text-gray-700 flex items-center gap-2 select-none"><div className="w-2 h-2 bg-indigo-500 rounded-full"></div>Teacher's Studio</h1>
                <div className="w-px h-4 bg-gray-300"></div>
                <button onClick={handleExport} disabled={isLoading} className="flex items-center gap-2 text-xs font-medium text-gray-600 hover:text-indigo-600 transition-colors"><IconDownload size={16} />{isLoading ? 'Saving...' : 'Save'}</button>
                <label className="flex items-center gap-2 text-xs font-medium text-gray-600 hover:text-indigo-600 transition-colors cursor-pointer"><IconUpload size={16} />Open<input type="file" accept=".json" className="hidden" onChange={handleImport} /></label>
              </div>
              
               <div className="fixed top-4 right-4 bg-white/90 backdrop-blur p-2 rounded-full shadow-lg border border-gray-200 z-40">
                 <button onClick={() => setShowAbout(true)} className="text-gray-500 hover:text-indigo-600 transition-colors"><IconInfo size={20} /></button>
               </div>

               {showAbout && (
                 <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={() => setShowAbout(false)}>
                   <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6" onClick={e => e.stopPropagation()}>
                     <div className="flex justify-between items-start mb-4">
                        <div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center text-indigo-600"><IconPen size={24} /></div><div><h2 className="text-xl font-bold text-gray-900">Teacher's Studio</h2><p className="text-sm text-gray-500">Portable Digital Whiteboard</p></div></div>
                        <button onClick={() => setShowAbout(false)} className="text-gray-400 hover:text-gray-600"><IconX size={24}/></button>
                     </div>
                     <div className="space-y-3 text-gray-600 mb-6"><p>A lightweight tool for teachers.</p><ul className="list-disc pl-5 space-y-1 text-sm"><li><strong>Single File:</strong> No install.</li><li><strong>Privacy:</strong> Data stays on device.</li></ul></div>
                     <div className="border-t border-gray-100 pt-4"><a href="mailto:feedback@teacherstudio.app" className="flex items-center justify-center gap-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-colors"><IconMail size={18} />Send Feedback</a><p className="text-center text-xs text-gray-400 mt-3">v1.0.6</p></div>
                   </div>
                 </div>
               )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TeacherStudio />);
    </script>
</body>
</html>
