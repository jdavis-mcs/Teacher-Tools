<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f4f8;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.5s;
        }

        /* The Big Timer Display */
        #timer-display {
            font-size: 20vw; /* Responsive size: huge on big screens */
            font-weight: bold;
            color: #2d3748;
            font-variant-numeric: tabular-nums; /* Keeps numbers from jumping width */
            line-height: 1;
            user-select: none;
        }

        /* Editable Title */
        #task-name {
            border: none;
            background: transparent;
            font-size: 2rem;
            text-align: center;
            color: #718096;
            margin-bottom: 20px;
            width: 80%;
            outline: none;
        }
        #task-name:focus { border-bottom: 2px solid #cbd5e0; }

        /* Progress Bar */
        .progress-container {
            width: 80%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            background: #4a90e2;
            transition: width 1s linear, background-color 0.3s;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:active { transform: translateY(2px); }

        .btn-start { background-color: #48bb78; color: white; }
        .btn-pause { background-color: #ecc94b; color: black; display: none; }
        .btn-reset { background-color: #cbd5e0; color: #4a5568; }

        /* Quick Add Buttons */
        .quick-add {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn-add {
            background-color: white;
            color: #4a5568;
            padding: 10px 20px;
            font-size: 1rem;
            border: 1px solid #e2e8f0;
        }

        .btn-add:hover { background-color: #ebf8ff; color: #3182ce; }

        /* Floating Home Button */
        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #718096;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .home-link:hover { text-decoration: underline; }

        /* STATES */
        body.time-up { background-color: #feb2b2; } /* Red */
        body.running .progress-bar { background-color: #48bb78; }
        body.paused { background-color: #fffff0; }

    </style>
</head>
<body>

    <a href="../index.html" class="home-link">← Back to Dashboard</a>

    <input type="text" id="task-name" value="Focus Time" placeholder="Name this task...">

    <div id="timer-display">05:00</div>

    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="startTimer()" id="startBtn">Start</button>
        <button class="btn-pause" onclick="pauseTimer()" id="pauseBtn">Pause</button>
        <button class="btn-reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="quick-add" id="quickAddPanel">
        <button class="btn-add" onclick="addTime(1)">+1 min</button>
        <button class="btn-add" onclick="addTime(5)">+5 min</button>
        <button class="btn-add" onclick="addTime(10)">+10 min</button>
        <button class="btn-add" onclick="addTime(-1)">-1 min</button>
    </div>

    <script>
        let totalTime = 300; // Default 5 mins in seconds
        let timeLeft = 300;
        let timerInterval = null;
        let isRunning = false;

        const display = document.getElementById('timer-display');
        const progressBar = document.getElementById('progress');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const quickAddPanel = document.getElementById('quickAddPanel');

        // --- AUDIO ENGINE (No files needed) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playAlarm() {
            // Creates a simple "Beep Beep" sound
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 note
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // Jump octave
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        // --- LOGIC ---

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            display.textContent = `${m}:${s}`;
            
            // Update Progress Bar
            const percent = (timeLeft / totalTime) * 100;
            progressBar.style.width = `${percent}%`;

            document.title = `(${m}:${s}) Class Timer`;
        }

        function startTimer() {
            if (isRunning) return;
            
            // Audio context needs user interaction to wake up
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isRunning = true;
            document.body.classList.add('running');
            document.body.classList.remove('paused');
            
            // Toggle Buttons
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            quickAddPanel.style.opacity = '0.5'; // Dim buttons so user knows not to click

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            document.body.classList.remove('running');
            document.body.classList.add('paused');
            
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';
            quickAddPanel.style.opacity = '1';
        }

        function resetTimer() {
            pauseTimer();
            document.body.classList.remove('paused', 'time-up');
            timeLeft = totalTime;
            updateDisplay();
        }

        function addTime(minutes) {
            const seconds = minutes * 60;
            if (!isRunning) {
                totalTime += seconds;
                if (totalTime < 60) totalTime = 60; // Minimum 1 min cap
                timeLeft = totalTime;
                updateDisplay();
            } else {
                // If running, just add to current time, don't change "total" (so progress bar fills up)
                timeLeft += seconds;
                updateDisplay();
            }
        }

        function finishTimer() {
            pauseTimer();
            document.body.classList.add('time-up');
            display.textContent = "00:00";
            progressBar.style.width = "0%";
            document.title = "TIME UP!";
            
            // Play alarm 3 times
            playAlarm();
            setTimeout(playAlarm, 800);
            setTimeout(playAlarm, 1600);
        }

        // Initialize
        updateDisplay();

    </script>
</body>
</html>
